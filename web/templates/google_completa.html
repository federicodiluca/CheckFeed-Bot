{% extends "base.html" %}
{% block title %}Completa la registrazione — {{ app_name }}{% endblock %}
{% block robots %}<meta name="robots" content="noindex, nofollow">{% endblock %}
{% block content %}
<div class="auth">
<h1>Completa la registrazione</h1>
<form method="post" class="card">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <p>Stai creando un account con l'indirizzo <strong>{{ email }}</strong> (verificato da Google).</p>
  <label class="check">
    <input type="checkbox" name="consent" required>
    Ho letto l'<a href="{{ url_for('privacy') }}" target="_blank" rel="noopener">informativa sulla privacy</a>
    e accetto i <a href="{{ url_for('terms') }}" target="_blank" rel="noopener">termini del servizio</a>.
    Acconsento a ricevere le notifiche che configurerò.
  </label>
  <button type="submit" class="button primary">Crea l'account</button>
</form>
</div>
{% endblock %}
