{% extends "base.html" %}
{% block title %}Accedi — {{ app_name }}{% endblock %}
{% block description %}Accedi al tuo account {{ app_name }} per gestire fonti, parole chiave e notifiche.{% endblock %}
{% block content %}
<h1>Accedi</h1>
<form method="post" class="card" novalidate>
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <input type="hidden" name="next" value="{{ next or '' }}">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="email" required value="{{ email or '' }}">
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button type="submit" class="button primary">Accedi</button>
  <p class="muted">Non hai un account? <a href="{{ url_for('auth.register') }}">Registrati</a></p>
</form>
{% endblock %}
