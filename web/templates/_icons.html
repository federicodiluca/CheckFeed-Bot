{#- Icone SVG inline, stile "line" uniforme (24x24, tratto 1.75, currentColor).
    Uso: {% from "_icons.html" import icon %}  {{ icon('mail') }}  {{ icon('bell', 20) }} -#}
{% macro icon(name, size=24, class='') -%}
<svg class="ico-svg {{ class }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == 'mail' -%}
<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7.5 12 13l8.5-5.5"/>
{%- elif name == 'send' -%}
<path d="M21 3 3.5 10.2c-.9.4-.8 1.6.1 1.9L10 14l2 6.4c.3.9 1.5 1 1.9.1L21 3Z"/><path d="M10 14 21 3"/>
{%- elif name == 'clock' -%}
<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>
{%- elif name == 'lock' -%}
<rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/><circle cx="12" cy="15.5" r="1"/>
{%- elif name == 'code' -%}
<path d="m8 8-4.5 4L8 16"/><path d="m16 8 4.5 4L16 16"/><path d="m13.5 5-3 14"/>
{%- elif name == 'sources' -%}
<rect x="3.5" y="4" width="17" height="16" rx="2.5"/><path d="M7.5 9h9M7.5 12.5h9M7.5 16h5"/>
{%- elif name == 'key' -%}
<circle cx="8" cy="15" r="4"/><path d="m11 12 8.5-8.5"/><path d="M16 7l2.5 2.5M18.5 4.5 21 7"/>
{%- elif name == 'bell' -%}
<path d="M6.5 16.5v-5a5.5 5.5 0 0 1 11 0v5l1.5 2h-14l1.5-2Z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>
{%- elif name == 'megaphone' -%}
<path d="M4 10v4a1.5 1.5 0 0 0 1.5 1.5H8l7 4V4.5l-7 4H5.5A1.5 1.5 0 0 0 4 10Z"/><path d="M18.5 9.5a3.5 3.5 0 0 1 0 5"/>
{%- elif name == 'check' -%}
<path d="m5 12.5 4.5 4.5L19 7.5"/>
{%- elif name == 'search' -%}
<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>
{%- elif name == 'shield' -%}
<path d="M12 3.5 5 6v6c0 4.2 3 7.4 7 8.5 4-1.1 7-4.3 7-8.5V6l-7-2.5Z"/><path d="m9.5 12 1.8 1.8 3.4-3.6"/>
{%- elif name == 'sun' -%}
<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/>
{%- elif name == 'moon' -%}
<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/>
{%- elif name == 'download' -%}
<path d="M12 4v11"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M5 19.5h14"/>
{%- elif name == 'trash' -%}
<path d="M5 7h14M9.5 7V5h5v2M8 7l.7 12h6.6L16 7"/>
{%- elif name == 'user' -%}
<circle cx="12" cy="8.5" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/>
{%- elif name == 'globe' -%}
<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.6 2.5 14.4 0 17M12 3.5c-2.5 2.6-2.5 14.4 0 17"/>
{%- endif -%}
</svg>
{%- endmacro %}
